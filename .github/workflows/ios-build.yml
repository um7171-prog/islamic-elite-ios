name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    name: Build iOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Resolve Swift packages
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      # Smoke test: compiles the whole app without any signing assets.
      - name: Compile (no code signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build | xcpretty || exit ${PIPESTATUS[0]}

      # To produce a signed IPA, add certificate/profile secrets and enable:
