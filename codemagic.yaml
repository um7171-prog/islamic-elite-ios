workflows:
  # Fully unsigned build — no Apple Developer account, certificates,
  # provisioning profiles, App Store Connect integration, or keychain
  # access required. Produces a plain IPA (Payload/App.app zipped) meant
  # to be signed externally afterwards. This is the workflow that should
  # be selected/run in Codemagic for unsigned builds.
  ios-build-unsigned:
    name: iOS build (unsigned IPA — no Apple credentials required)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # REQUIRED: create a variable group named exactly "supabase" in
      # Codemagic (Team settings -> Environment variables) containing
      # VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY (copy the values
      # from the local .env file). Without this group, "npm run build" below
      # bakes in an empty Supabase URL, which crashes the whole app with a
      # blank/black screen on launch (see src/integrations/supabase/client.ts).
      groups:
        - supabase
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.techsnds.islamicelite"
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web bundle
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "1.0.0"
          agvtool new-version -all "$BUILD_NUMBER"
          cd ../..
      - name: Resolve Swift packages
        script: |
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -resolvePackageDependencies
      - name: Build app (no code signing)
        script: |
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/App.app"
          OUT_DIR="$CM_BUILD_DIR/build/ios/ipa"
          rm -rf "$CM_BUILD_DIR/build/Payload" "$OUT_DIR"
          mkdir -p "$CM_BUILD_DIR/build/Payload" "$OUT_DIR"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/Payload/"
          cd "$CM_BUILD_DIR/build"
          zip -qry "$OUT_DIR/IslamicElite-unsigned.ipa" Payload
          ls -lh "$OUT_DIR"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - um7171@gmail.com

  # Signed release workflow — requires an "App Store Connect" integration
  # configured in Codemagic (Team settings -> Integrations) plus
  # certificates/provisioning profiles fetched via that integration. Do
  # NOT select this workflow for an unsigned/manual-signing build.
  ios-release-signed:
    name: iOS release (signed IPA via App Store Connect)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # TODO: create an "App Store Connect" integration in Codemagic
      # (Team settings -> Integrations -> App Store Connect, using an API key
      # generated in App Store Connect -> Users and Access -> Keys) and put its
      # exact name here. This repo intentionally holds no certificates/keys.
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.techsnds.islamicelite
      # REQUIRED: see the same "supabase" group note in ios-build-unsigned
      # above — this workflow also runs "npm run build" and needs it too.
      groups:
        - supabase
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.techsnds.islamicelite"
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm ci || npm install
      - name: Build web bundle
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version "1.0.0"
          agvtool new-version -all "$BUILD_NUMBER"
          cd ../..
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Apply signing settings to Xcode project
        script: xcode-project use-profiles
      - name: Resolve Swift packages
        script: |
          xcodebuild -project "$CM_BUILD_DIR/$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies
      - name: Build & export signed ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist "$CM_BUILD_DIR/ios/ExportOptions.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - um7171@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: false
